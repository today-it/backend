name: todayit

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_ENVSUBST_FILTER: PUBLIC_IP
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    volumes:
      - ../nginx/${NGINX_CONFIG:-bootstrap}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${DATA_ROOT:-./data}/certbot-webroot:/var/www/certbot:ro
      - ${DATA_ROOT:-./data}/letsencrypt:/etc/letsencrypt:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  certbot:
    image: certbot/certbot:v5.4.0
    profiles: ["ops"]
    volumes:
      - ${DATA_ROOT:-./data}/certbot-webroot:/var/www/certbot
      - ${DATA_ROOT:-./data}/letsencrypt:/etc/letsencrypt

  api:
    image: ${API_IMAGE:-todayit-api:local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_SCHEMA: ${POSTGRES_DB_SCHEMA:-todayit}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-todayit}?currentSchema=${POSTGRES_DB_SCHEMA:-todayit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-todayit_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_METRICS_TAGS_APPLICATION: todayit-api
      TODAYIT_SECURITY_CORS_ORIGINS_0: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      TODAYIT_SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TODAYIT_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-30m}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
    expose:
      - "8080"
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:8080/actuator/health/liveness",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 768M

  data-worker:
    image: ${DATA_WORKER_IMAGE:-todayit-data-worker:local}
    profiles: ["worker"]
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_SCHEMA: ${POSTGRES_DB_SCHEMA:-todayit}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-todayit}?currentSchema=${POSTGRES_DB_SCHEMA:-todayit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-todayit_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx320m
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todayit}
      POSTGRES_USER: ${POSTGRES_USER:-todayit_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
      - ${DATA_ROOT:-./data}/backups:/backups
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 192M

  prometheus:
    image: prom/prometheus:v3.10.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - backend
      - monitoring
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M

  grafana:
    image: grafana/grafana:12.3.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: ko-KR
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - backend
      - monitoring
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  prometheus-data:
  grafana-data:

networks:
  edge:
  monitoring:
  backend:
    internal: true
